<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Cart - Food Shop</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            color: white;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 6px;
            font-size: clamp(28px, 5vw, 42px);
        }

        header p {
            margin-bottom: 0;
            color: rgba(255, 255, 255, 0.9);
        }

        a {
            color: #5b65d8;
            font-weight: 700;
        }

        .back-link {
            flex: 0 0 auto;
            padding: 11px 16px;
            border-radius: 9px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
            align-items: start;
            gap: 22px;
        }

        .panel {
            padding: 26px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 14px 36px rgba(32, 25, 82, 0.2);
        }

        .panel h2 {
            margin-bottom: 18px;
            font-size: 22px;
        }

        .cart-empty {
            padding: 26px 16px;
            border-radius: 10px;
            background: #f5f6fb;
            color: #6b7080;
            text-align: center;
        }

        .cart-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #e8e9f1;
        }

        .item-name {
            margin-bottom: 5px;
            font-weight: 700;
        }

        .item-price {
            color: #626986;
            font-size: 14px;
        }

        .item-total {
            margin-top: 8px;
            color: #555fc8;
            font-weight: 700;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .quantity-button {
            width: 30px;
            height: 30px;
            border: 1px solid #7178d9;
            border-radius: 7px;
            background: white;
            color: #545dca;
            cursor: pointer;
            font-size: 17px;
        }

        .quantity-button:disabled {
            border-color: #d7d8e0;
            color: #aaa;
            cursor: not-allowed;
        }

        .remove-button {
            display: block;
            margin: 8px 0 0 auto;
            padding: 5px 8px;
            border: 0;
            border-radius: 6px;
            background: #fff0f0;
            color: #b33838;
            cursor: pointer;
            font-weight: 600;
        }

        .totals {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .total-row.grand-total {
            margin-top: 4px;
            padding-top: 14px;
            border-top: 2px solid #e8e9f1;
            font-size: 21px;
            font-weight: 800;
        }

        .promo-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e8e9f1;
        }

        .promo-entry {
            display: flex;
            gap: 8px;
        }

        .promo-entry input {
            min-width: 0;
            flex: 1;
        }

        .promotions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .promotion-code {
            padding: 7px 10px;
            border: 1px solid #d5d7f0;
            border-radius: 8px;
            background: #f6f6ff;
            color: #5058b8;
            cursor: pointer;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #cfd1dc;
            border-radius: 8px;
            background: white;
            color: #333;
            font: inherit;
        }

        input:focus, select:focus {
            outline: 2px solid #aeb3fa;
            border-color: #667eea;
        }

        button.primary {
            min-height: 44px;
            padding: 11px 16px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
        }

        button.primary:disabled {
            background: #bfc1ca;
            cursor: not-allowed;
        }

        .place-order {
            width: 100%;
            margin-top: 6px;
        }

        .message {
            display: none;
            margin: 14px 0 0;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.45;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #932e2e;
        }

        .message.success {
            display: block;
            background: #ebf8ef;
            color: #22653a;
        }

        .notice {
            margin-top: 14px;
            color: #9a5c00;
            font-size: 14px;
        }

        .success-panel {
            margin-top: 18px;
            padding: 18px;
            border-radius: 10px;
            background: #ebf8ef;
            color: #22653a;
            line-height: 1.6;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
            }

            header {
                align-items: flex-start;
                flex-direction: column-reverse;
            }

            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Review your cart</h1>
                <p>Check your items and total before placing your order.</p>
            </div>
            <a class="back-link" href="/">Continue shopping</a>
        </header>

        <main class="checkout-layout">
            <section class="panel" aria-labelledby="orderTitle">
                <h2 id="orderTitle">Your items</h2>
                <div id="checkoutItems" aria-live="polite"></div>
                <p id="availabilityNotice" class="notice" hidden></p>

                <div class="totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotalAmount">$0.00</span>
                    </div>
                    <div class="total-row" id="discountRow" hidden>
                        <span>Promotion discount</span>
                        <span id="discountAmount">−$0.00</span>
                    </div>
                    <div class="total-row grand-total">
                        <span>Total</span>
                        <span id="totalAmount">$0.00</span>
                    </div>
                </div>

                <div class="promo-box">
                    <h3>Promotion code</h3>
                    <div class="promo-entry">
                        <input id="promoCode" type="text" placeholder="Enter code" autocomplete="off">
                        <button class="primary" id="applyPromoButton" type="button">Apply</button>
                    </div>
                    <div id="appliedPromotion" class="message" role="status"></div>
                    <div id="promotionsList" class="promotions-list" aria-label="Available promotions"></div>
                </div>
            </section>

            <section class="panel" aria-labelledby="paymentTitle">
                <h2 id="paymentTitle">Your details and payment</h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="customerName">Name</label>
                        <input id="customerName" name="name" type="text" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="customerEmail">Email</label>
                        <input id="customerEmail" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="paymentMethod">Payment method</label>
                        <select id="paymentMethod" name="paymentMethod">
                            <option value="credit_card">Credit Card</option>
                            <option value="debit_card">Debit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="apple_pay">Apple Pay</option>
                            <option value="google_pay">Google Pay</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="cash">Cash</option>
                        </select>
                    </div>
                    <div class="form-group" id="cardField">
                        <label for="cardLastFour">Card last 4 digits</label>
                        <input id="cardLastFour" name="cardLastFour" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="cc-number">
                    </div>
                    <button class="primary place-order" id="placeOrderButton" type="submit" disabled>
                        Place order
                    </button>
                    <p id="checkoutMessage" class="message" role="alert"></p>
                </form>

                <div id="successPanel" class="success-panel" hidden></div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = '/api/v1';
        const CART_STORAGE_KEY = 'foodShopCart';
        const PROMOTION_STORAGE_KEY = 'foodShopPromotion';
        let cart = readCart();
        let foods = [];
        let appliedPromotion = readPromotion();
        let isSubmitting = false;

        function readCart() {
            try {
                const storedCart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
                return Array.isArray(storedCart)
                    ? storedCart.filter(item =>
                        item &&
                        Number.isInteger(item.food_id) &&
                        Number.isInteger(item.quantity) &&
                        item.quantity > 0
                    )
                    : [];
            } catch (error) {
                console.error('Unable to restore the saved cart:', error);
                localStorage.removeItem(CART_STORAGE_KEY);
                return [];
            }
        }

        function readPromotion() {
            try {
                const promotion = JSON.parse(localStorage.getItem(PROMOTION_STORAGE_KEY) || 'null');
                return promotion && promotion.is_valid && typeof promotion.code === 'string'
                    ? promotion
                    : null;
            } catch (error) {
                console.error('Unable to restore the saved promotion:', error);
                localStorage.removeItem(PROMOTION_STORAGE_KEY);
                return null;
            }
        }

        function saveCart() {
            try {
                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            } catch (error) {
                console.error('Unable to save the cart:', error);
                showMessage('Unable to save your cart in this browser.', 'error');
            }
        }

        function savePromotion() {
            try {
                if (appliedPromotion) {
                    localStorage.setItem(PROMOTION_STORAGE_KEY, JSON.stringify(appliedPromotion));
                } else {
                    localStorage.removeItem(PROMOTION_STORAGE_KEY);
                }
            } catch (error) {
                console.error('Unable to save the promotion:', error);
                showMessage('Unable to save your promotion in this browser.', 'error');
            }
        }

        function showMessage(message, type) {
            const element = document.getElementById('checkoutMessage');
            element.textContent = message;
            element.className = `message ${type}`;
        }

        function clearMessage() {
            const element = document.getElementById('checkoutMessage');
            element.textContent = '';
            element.className = 'message';
        }

        function getSubtotal() {
            return cart.reduce((total, item) => total + item.price * item.quantity, 0);
        }

        function clearAppliedPromotion() {
            if (!appliedPromotion) return;
            appliedPromotion = null;
            savePromotion();
            const message = document.getElementById('appliedPromotion');
            message.textContent = '';
            message.className = 'message';
            renderCart();
        }

        function makeButton(text, className, onClick, disabled = false) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = className;
            button.textContent = text;
            button.disabled = disabled;
            button.addEventListener('click', onClick);
            return button;
        }

        function renderCart() {
            const container = document.getElementById('checkoutItems');
            const notice = document.getElementById('availabilityNotice');
            const placeOrderButton = document.getElementById('placeOrderButton');
            container.replaceChildren();

            if (cart.length === 0) {
                const emptyMessage = document.createElement('p');
                emptyMessage.className = 'cart-empty';
                emptyMessage.textContent = 'Your cart is empty. Add items from the menu to get started.';
                container.appendChild(emptyMessage);
            }

            let hasUnavailableItems = false;
            for (const item of cart) {
                const food = foods.find(menuItem => menuItem.id === item.food_id);
                if (!food || item.quantity > food.stock) {
                    hasUnavailableItems = true;
                }

                const row = document.createElement('article');
                row.className = 'cart-item';

                const details = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = item.name || (food && food.name) || 'Unavailable item';

                const price = document.createElement('div');
                price.className = 'item-price';
                price.textContent = `$${Number(item.price || 0).toFixed(2)} each`;

                const lineTotal = document.createElement('div');
                lineTotal.className = 'item-total';
                lineTotal.textContent = `${item.quantity} × $${Number(item.price || 0).toFixed(2)} = $${(item.quantity * Number(item.price || 0)).toFixed(2)}`;

                details.append(name, price, lineTotal);

                const controls = document.createElement('div');
                controls.className = 'item-controls';
                const quantityControls = document.createElement('div');
                quantityControls.className = 'quantity-controls';
                quantityControls.append(
                    makeButton('−', 'quantity-button', () => changeQuantity(item.food_id, -1), item.quantity <= 1),
                    Object.assign(document.createElement('span'), { textContent: String(item.quantity) }),
                    makeButton('+', 'quantity-button', () => changeQuantity(item.food_id, 1), !food || item.quantity >= food.stock)
                );
                controls.appendChild(quantityControls);
                controls.appendChild(
                    makeButton('Remove', 'remove-button', () => removeItem(item.food_id))
                );

                row.append(details, controls);
                container.appendChild(row);
            }

            const subtotal = getSubtotal();
            const total = appliedPromotion ? appliedPromotion.final_total : subtotal;
            const discount = Math.max(0, subtotal - total);
            document.getElementById('subtotalAmount').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
            document.getElementById('discountAmount').textContent = `−$${discount.toFixed(2)}`;
            document.getElementById('discountRow').hidden = !appliedPromotion;

            notice.hidden = !hasUnavailableItems;
            notice.textContent = hasUnavailableItems
                ? 'Some items are unavailable or exceed current stock. Update or remove them to continue.'
                : '';
            placeOrderButton.disabled = cart.length === 0 || hasUnavailableItems || isSubmitting;
            saveCart();
        }

        function changeQuantity(foodId, change) {
            const item = cart.find(cartItem => cartItem.food_id === foodId);
            const food = foods.find(menuItem => menuItem.id === foodId);
            if (!item || !food) return;

            const nextQuantity = item.quantity + change;
            if (nextQuantity < 1 || nextQuantity > food.stock) return;

            clearAppliedPromotion();
            item.quantity = nextQuantity;
            saveCart();
            renderCart();
            clearMessage();
        }

        function removeItem(foodId) {
            clearAppliedPromotion();
            cart = cart.filter(item => item.food_id !== foodId);
            saveCart();
            renderCart();
            clearMessage();
        }

        async function loadFoods() {
            const response = await fetch(`${API_BASE}/foods`);
            if (!response.ok) {
                throw new Error('Could not load menu prices and stock. Please refresh and try again.');
            }
            foods = await response.json();
            cart = cart.map(item => {
                const food = foods.find(menuItem => menuItem.id === item.food_id);
                return food ? { ...item, name: food.name, price: food.price } : item;
            });
            saveCart();
            if (appliedPromotion && cart.length > 0) {
                await applyPromotion(appliedPromotion.code, true);
            } else {
                renderCart();
            }
        }

        async function loadPromotions() {
            const list = document.getElementById('promotionsList');
            try {
                const response = await fetch(`${API_BASE}/promotions/active/all`);
                if (!response.ok) throw new Error('Could not load active promotions.');
                const promotions = await response.json();
                list.replaceChildren();

                for (const promotion of promotions) {
                    const button = makeButton(
                        promotion.code,
                        'promotion-code',
                        () => {
                            document.getElementById('promoCode').value = promotion.code;
                            applyPromotion(promotion.code);
                        }
                    );
                    button.title = promotion.title;
                    list.appendChild(button);
                }

                if (promotions.length === 0) {
                    list.textContent = 'No active promotions right now.';
                }
            } catch (error) {
                console.error('Unable to load promotions:', error);
                list.textContent = 'Promotions could not be loaded.';
            }
        }

        async function applyPromotion(code, silent = false) {
            if (cart.length === 0) {
                if (!silent) {
                    showMessage('Add items to your cart before applying a promotion.', 'error');
                }
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/promotions/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, order_total: getSubtotal() })
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || 'Could not apply this promotion.');
                }
                if (!result.is_valid) {
                    appliedPromotion = null;
                    savePromotion();
                    const promotionMessage = document.getElementById('appliedPromotion');
                    promotionMessage.textContent = '';
                    promotionMessage.className = 'message';
                    renderCart();
                    showMessage(result.message, 'error');
                    return;
                }

                appliedPromotion = result;
                savePromotion();
                const promotionMessage = document.getElementById('appliedPromotion');
                promotionMessage.textContent = `${result.title} applied. You save $${result.discount_amount.toFixed(2)}.`;
                promotionMessage.className = 'message success';
                renderCart();
                if (silent) {
                    clearMessage();
                } else {
                    showMessage('Promotion applied.', 'success');
                }
            } catch (error) {
                console.error('Unable to apply promotion:', error);
                showMessage(error.message || 'Could not apply this promotion.', 'error');
            }
        }

        async function placeOrder(event) {
            event.preventDefault();
            const form = document.getElementById('checkoutForm');
            if (!form.reportValidity() || cart.length === 0 || isSubmitting) return;

            const name = document.getElementById('customerName').value.trim();
            const email = document.getElementById('customerEmail').value.trim();
            const paymentMethod = document.getElementById('paymentMethod').value;
            const cardLastFour = document.getElementById('cardLastFour').value.trim();
            if (paymentMethod.includes('card') && !/^\d{4}$/.test(cardLastFour)) {
                showMessage('Enter the last four digits of your card.', 'error');
                return;
            }

            isSubmitting = true;
            renderCart();
            clearMessage();
            const placeOrderButton = document.getElementById('placeOrderButton');
            placeOrderButton.textContent = 'Processing...';

            try {
                const orderResponse = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: name,
                        customer_email: email,
                        items: cart.map(item => ({ food_id: item.food_id, quantity: item.quantity })),
                        promotion_code: appliedPromotion ? appliedPromotion.code : null
                    })
                });
                const order = await orderResponse.json();
                if (!orderResponse.ok) {
                    throw new Error(order.detail || 'Could not create your order.');
                }

                const paymentResponse = await fetch(`${API_BASE}/payments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: order.id,
                        payment_method: paymentMethod,
                        amount: order.total_amount,
                        card_last_four: cardLastFour || null
                    })
                });
                const payment = await paymentResponse.json();
                if (!paymentResponse.ok) {
                    throw new Error(payment.detail || 'Could not create your payment.');
                }

                const confirmResponse = await fetch(`${API_BASE}/payments/${payment.id}/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transaction_id: `TXN-${Date.now()}` })
                });
                const confirmedPayment = await confirmResponse.json();
                if (!confirmResponse.ok) {
                    throw new Error(confirmedPayment.detail || 'Could not confirm your payment.');
                }

                cart = [];
                appliedPromotion = null;
                saveCart();
                savePromotion();
                renderCart();
                form.hidden = true;
                const success = document.getElementById('successPanel');
                success.textContent = `Thanks, ${name}. Order #${order.id} was placed for $${order.total_amount.toFixed(2)}. Payment status: ${confirmedPayment.status}.`;
                success.hidden = false;
            } catch (error) {
                console.error('Checkout failed:', error);
                showMessage(error.message || 'Checkout failed. Please try again.', 'error');
            } finally {
                isSubmitting = false;
                placeOrderButton.textContent = 'Place order';
                renderCart();
            }
        }

        function updatePaymentFields() {
            const isCard = document.getElementById('paymentMethod').value.includes('card');
            const cardField = document.getElementById('cardField');
            const cardInput = document.getElementById('cardLastFour');
            cardField.hidden = !isCard;
            cardInput.required = isCard;
        }

        document.getElementById('applyPromoButton').addEventListener('click', () => {
            const code = document.getElementById('promoCode').value.trim();
            if (code) applyPromotion(code);
        });
        document.getElementById('checkoutForm').addEventListener('submit', placeOrder);
        document.getElementById('paymentMethod').addEventListener('change', updatePaymentFields);

        updatePaymentFields();
        renderCart();
        Promise.all([loadFoods(), loadPromotions()]).catch(error => {
            console.error('Could not initialize checkout:', error);
            showMessage(error.message || 'Could not load checkout details.', 'error');
        });
    </script>
</body>
</html>
